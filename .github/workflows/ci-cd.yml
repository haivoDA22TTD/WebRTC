name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ==================== FRONTEND ====================
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            src:
              - 'frontend/**'

      - name: Setup Node.js
        if: steps.changes.outputs.src == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.src == 'true'
        run: npm ci

      - name: Lint
        if: steps.changes.outputs.src == 'true'
        run: npm run lint

      - name: Build
        if: steps.changes.outputs.src == 'true'
        run: npm run build

      - name: Upload build artifact
        if: steps.changes.outputs.src == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

    outputs:
      changed: ${{ steps.changes.outputs.src }}

  # ==================== GATEWAY ====================
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            src:
              - 'gateway/**'

      - name: Setup Java 17
        if: steps.changes.outputs.src == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: gateway/pom.xml

      - name: Build & Test
        if: steps.changes.outputs.src == 'true'
        run: ./mvnw clean verify -B

    outputs:
      changed: ${{ steps.changes.outputs.src }}

  # ==================== AUTH SERVICE ====================
  auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth
    steps:
      - uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            src:
              - 'auth/**'

      - name: Setup Java 17
        if: steps.changes.outputs.src == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: auth/pom.xml

      - name: Build & Test
        if: steps.changes.outputs.src == 'true'
        run: ./mvnw clean verify -B

    outputs:
      changed: ${{ steps.changes.outputs.src }}

  # ==================== ROOM SERVICE ====================
  room:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: room
    steps:
      - uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
