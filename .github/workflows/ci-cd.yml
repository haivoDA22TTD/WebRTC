        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.changes.outputs.src == 'true'
        run: npm install

    outputs:
      changed: ${{ steps.changes.outputs.src }}

  # ==================== NOTIFICATION SERVICE ====================
  notification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification
    steps:
      - uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            src:
              - 'notification/**'

      - name: Setup Java 17
        if: steps.changes.outputs.src == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: notification/pom.xml

      - name: Build & Test
        if: steps.changes.outputs.src == 'true'
        run: ./mvnw clean verify -B

    outputs:
      changed: ${{ steps.changes.outputs.src }}

  # ==================== BUILD & PUSH DOCKER IMAGES ====================
  docker:
    needs: [frontend, gateway, auth, room, signaling, chat, profile, eureka-server, sfu, notification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
          - service: gateway
            context: ./gateway
          - service: auth
            context: ./auth
          - service: room
            context: ./room
          - service: signaling
            context: ./signaling
          - service: chat
            context: ./chat
          - service: profile
            context: ./profile
          - service: eureka-server
            context: ./eureka-server
          - service: sfu
            context: ./sfu
          - service: notification
            context: ./notification
    steps:
      - uses: actions/checkout@v4

      - name: Check if service changed
        id: check
        run: |
          case "${{ matrix.service }}" in
            frontend) echo "changed=${{ needs.frontend.outputs.changed }}" >> $GITHUB_OUTPUT ;;
            gateway) echo "changed=${{ needs.gateway.outputs.changed }}" >> $GITHUB_OUTPUT ;;
            auth) echo "changed=${{ needs.auth.outputs.changed }}" >> $GITHUB_OUTPUT ;;
            room) echo "changed=${{ needs.room.outputs.changed }}" >> $GITHUB_OUTPUT ;;
            signaling) echo "changed=${{ needs.signaling.outputs.changed }}" >> $GITHUB_OUTPUT ;;
            chat) echo "changed=${{ needs.chat.outputs.changed }}" >> $GITHUB_OUTPUT ;;
            profile) echo "changed=${{ needs.profile.outputs.changed }}" >> $GITHUB_OUTPUT ;;
            eureka-server) echo "changed=${{ needs.eureka-server.outputs.changed }}" >> $GITHUB_OUTPUT ;;
            sfu) echo "changed=${{ needs.sfu.outputs.changed }}" >> $GITHUB_OUTPUT ;;
            notification) echo "changed=${{ needs.notification.outputs.changed }}" >> $GITHUB_OUTPUT ;;
          esac

      - name: Login to GitHub Container Registry
        if: steps.check.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        if: steps.check.outputs.changed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push ${{ matrix.service }}
        if: steps.check.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

