<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${subject}">Notification</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #5865f2; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { background: #f9f9f9; padding: 20px; border-radius: 0 0 8px 8px; }
        .footer { text-align: center; margin-top: 20px; color: #666; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>WebRTC Meeting</h1>
        </div>
        <div class="content">
            <h2 th:text="${subject}">Subject</h2>
            <p th:text="${message}">Message content</p>
        </div>
        <div class="footer">
            <p>© 2025 WebRTC Meeting. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
