# TURN server configuration

# Network settings
listening-port=3478
tls-listening-port=5349

# Relay ports range
min-port=49152
max-port=49200

# Use fingerprint in TURN messages
fingerprint

# Long-term credential mechanism
lt-cred-mech

# Realm (domain)
realm=webrtc.local

# Static user credentials (for development)
# Format: user=username:password
user=webrtc:webrtc123

# Server name
server-name=webrtc-coturn

# Logging
log-file=stdout
verbose

# Disable CLI
no-cli

# Disable multicast peers
no-multicast-peers

# Mobility (for mobile clients)
mobility

# Stale nonce lifetime
stale-nonce=600

# Max allocations per user
user-quota=12
total-quota=1200
